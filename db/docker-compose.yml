version: '3'
services:
  shortener:
    image: postgres
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432 # make sure you don't have another container running on 5432

    environment:
      - POSTGRES_DB=urlShortener
      - POSTGRES_USER=url
      - POSTGRES_PASSWORD=shortener

